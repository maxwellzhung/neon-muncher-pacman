<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Muncher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-label="Neon Muncher arcade game">
      <section class="game-panel">
        <div class="topbar">
          <div>
            <span class="label icon-label" aria-label="分数" title="分数">
              <svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8"></circle>
                <path d="M12 7v10M8 10h7a2 2 0 0 1 0 4H9"></path>
              </svg>
            </span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="label icon-label" aria-label="最高分" title="最高分">
              <svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"></path>
                <path d="M7 7H4a3 3 0 0 0 3 3M17 7h3a3 3 0 0 1-3 3"></path>
              </svg>
            </span>
            <strong id="best">0</strong>
          </div>
          <div>
            <span class="label icon-label" aria-label="关卡" title="关卡">
              <svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path>
              </svg>
            </span>
            <strong id="level">1</strong>
          </div>
          <div>
            <span class="label icon-label" aria-label="生命" title="生命">
              <svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20s-7-4.4-9-9a4.5 4.5 0 0 1 8-4 4.5 4.5 0 0 1 8 4c-2 4.6-9 9-9 9Z"></path>
              </svg>
            </span>
            <strong id="lives">3</strong>
          </div>
          <div class="status-card">
            <span class="label icon-label" aria-label="状态" title="状态">
              <svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v4M12 17v4M4.2 7.5l3.4 2M16.4 14l3.4 2M19.8 7.5l-3.4 2M7.6 14l-3.4 2"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
            <strong id="status">待机</strong>
          </div>
          <div>
            <span class="label icon-label" aria-label="进度" title="进度">
              <svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 18h16M4 12h10M4 6h6"></path>
              </svg>
            </span>
            <strong id="progress">0%</strong>
          </div>
        </div>
        <div class="progress-rail" aria-hidden="true">
          <span id="progressBar"></span>
        </div>

        <div class="canvas-wrap">
          <canvas id="game" width="560" height="620" tabindex="0" aria-label="Pac-Man style maze game"></canvas>
          <div class="quick-pad" aria-label="方向控制">
            <button type="button" data-dir="up" aria-label="向上" title="向上">▲</button>
            <button type="button" data-dir="left" aria-label="向左" title="向左">◀</button>
            <button type="button" data-dir="down" aria-label="向下" title="向下">▼</button>
            <button type="button" data-dir="right" aria-label="向右" title="向右">▶</button>
          </div>
          <div class="game-actions" aria-label="游戏操作">
            <button id="soundButton" type="button" aria-label="音乐开关" title="音乐开关" aria-pressed="true">
              <svg class="action-icon sound-on" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
                <path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path>
              </svg>
              <svg class="action-icon sound-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10v4h4l5 4V6l-5 4H4Z"></path>
                <path d="M18 9l4 4M22 9l-4 4"></path>
              </svg>
            </button>
            <button id="pauseButton" type="button" aria-label="暂停" title="暂停">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14M16 5v14"></path>
              </svg>
            </button>
            <button id="resetButton" type="button" aria-label="重新开始" title="重新开始">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12a7 7 0 1 0 2-5"></path>
                <path d="M5 4v5h5"></path>
              </svg>
            </button>
          </div>
          <div id="overlay" class="overlay">
            <h1>Neon Muncher</h1>
            <p id="overlayText">吃掉所有能量豆，避开巡逻幽灵。</p>
            <div class="intro-grid" aria-label="玩法介绍">
              <span>
                <b title="移动">◆</b>
                ← ↑ ↓ → / WASD
              </span>
              <span>
                <b title="能量豆">●</b>
                反吃幽灵
              </span>
              <span>
                <b title="奖励">✦</b>
                限时水果
              </span>
              <span>
                <b title="暂停和重开">Ⅱ</b>
                P / Enter
              </span>
            </div>
            <button id="startButton" type="button">开始游戏</button>
          </div>
        </div>

      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
